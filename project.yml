name: BlenderARCam
options:
  bundleIdPrefix: com.custom
targets:
  BlenderARCam:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        NSCameraUsageDescription: "Śledzenie ruchu kamery 6DOF w ARKit"
        NSLocalNetworkUsageDescription: "Wysyłanie pozycji kamery do Blendera po lokalnym Wi-Fi"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          info:
      path: Info.plist
      properties:
        NSCameraUsageDescription: "Wymagany dostęp do aparatu dla ARKit"
        NSLocalNetworkUsageDescription: "Wymagany dostęp do sieci lokalnej do komunikacji z Blenderem"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.blenderarcam
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
